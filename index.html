window.addEventListener('hashchange',()=>{CUR=location.hash.replace('#/','')||'dashboard';closeSheet();render();});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();go(a.getAttribute('href').slice(2));},true);
setInterval(tick,1000);
(async function init(){const d=await Store.load();S=d?migrate(d):defaultState();if(!S.ui.theme)S.ui.theme=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';render();Store.save(S);})();
</script></body></html>
